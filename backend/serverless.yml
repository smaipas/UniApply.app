service: uniapply-app
frameworkVersion: "4"
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-central-1
  stage: ${opt:stage, 'dev'}

  httpApi:
    disableDefaultEndpoint: true
    cors:
      allowedOrigins:
        - ${env:FRONTEND_URL, 'http://localhost:5173'}
        - ${env:PRODUCTION_URL, 'https://uniapply.app'}
        - ${env:STAGING_URL, 'https://staging.uniapply.app'}
        - https://dev.uniapply.app
        - https://uniapply.app
      allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
      allowedHeaders:
        - "Authorization"
        - "Content-Type"
        - "X-Requested-With"
        - "X-API-Key"
        - "X-Content-Type-Options"
        - "X-Frame-Options"
        - "X-XSS-Protection"
        - "Strict-Transport-Security"
        - "Content-Security-Policy"
        - "Referrer-Policy"
        - "Permissions-Policy"
        - "X-Permitted-Cross-Domain-Policies"
        - "x-ratelimit-limit"
        - "x-ratelimit-remaining"
        - "x-ratelimit-reset"
        - "retry-after"

      allowCredentials: true
      maxAge: 86400

  logRetentionInDays: 30
  tracing:
    lambda: true
  tags:
    Service: ${self:service}
    Stage: ${sls:stage}

  environment:
    REGION: ${self:provider.region}
    STAGE: ${sls:stage}
    USERS_TABLE: ${self:service}-users-${sls:stage}
    FORMS_TABLE: ${self:service}-forms-${sls:stage}
    APPLICATIONS_TABLE: ${self:service}-applications-${sls:stage}
    ROLES_TABLE: ${self:service}-roles-${sls:stage}
    AUDIT_TABLE: ${self:service}-audit-${sls:stage}
    RATE_LIMIT_TABLE: ${self:service}-rate-limits-${sls:stage}
    TOKEN_BLACKLIST_TABLE: ${self:service}-token-blacklist-${sls:stage}
    SECURITY_EVENTS_TABLE: ${self:service}-security-events-${sls:stage}
    WEB_BUCKET: { Ref: WebBucket }
    UPLOADS_BUCKET: { Ref: UploadsBucket }
    USER_POOL_ID: { Ref: CognitoUserPool }
    USER_POOL_CLIENT_ID: { Ref: CognitoUserPoolClient }
    SES_SENDER_EMAIL: ${env:SES_SENDER_EMAIL, 'no-reply@uniapply.app'}
    FRONTEND_URL: ${env:FRONTEND_URL, 'https://dev.uniapply.app'}
    APP_NAME: ${env:APP_NAME, 'UniApply'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:DescribeTable
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.USERS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.FORMS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.APPLICATIONS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.ROLES_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.AUDIT_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.RATE_LIMIT_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.TOKEN_BLACKLIST_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.SECURITY_EVENTS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.APPLICATIONS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.environment.USERS_TABLE}/index/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - { "Fn::GetAtt": [WebBucket, Arn] }
            - { "Fn::Join": ["", [{ "Fn::GetAtt": [WebBucket, Arn] }, "/*"]] }
            - { "Fn::GetAtt": [UploadsBucket, Arn] }
            - {
                "Fn::Join":
                  ["", [{ "Fn::GetAtt": [UploadsBucket, Arn] }, "/*"]],
              }
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:ListUsers
            - cognito-idp:DescribeUserPool
          Resource:
            - { "Fn::GetAtt": [CognitoUserPool, Arn] }
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:${self:provider.region}:${aws:accountId}:parameter/uniapply/${sls:stage}/*

params:
  default:
    appBaseUrl: ${ssm:/uniapply/${sls:stage}/appBaseUrl, 'http://localhost:5173'}
    localDevUrl: ${env:LOCAL_DEV_URL, 'http://localhost:5173'}
    apiDomainName: ${ssm:/uniapply/${sls:stage}/api/domainName, ''}
    apiHostedZoneId: ${ssm:/uniapply/${sls:stage}/route53/hostedZoneId, ''}
    apiCertificateArn: ${ssm:/uniapply/${sls:stage}/acm/certArn, ''}
    frontendDomainName: ${ssm:/uniapply/${sls:stage}/frontend/domainName, ''}
    frontendHostedZoneId: ${ssm:/uniapply/${sls:stage}/route53/hostedZoneId, ''}
    frontendCertificateArn: ${ssm:/uniapply/${sls:stage}/acm/cloudfrontCertArn, ''}
    wafArn: ${ssm:/uniapply/${sls:stage}/waf/arn, ''}

package:
  individually: true

custom:
  httpApi:
    responseData:
      headers:
        X-Content-Type-Options: nosniff
        X-Frame-Options: DENY
        X-XSS-Protection: "1; mode=block"
        Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
        Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
        Referrer-Policy: "strict-origin-when-cross-origin"
        Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
        X-Permitted-Cross-Domain-Policies: "none"
        Cache-Control: "no-store, no-cache, must-revalidate, private"
        Pragma: "no-cache"
        Expires: "0"
        Access-Control-Expose-Headers: "x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset, retry-after"

build:
  esbuild:
    minify: true
    sourcemap: true
    target: node20
    external:
      - zod
    exclude:
      - aws-sdk

functions:
  api:
    handler: src/handler.main
    memorySize: 512
    timeout: 15
    architecture: arm64
    events:
      # Auth endpoints (public)
      - httpApi:
          path: /auth/login
          method: POST
      - httpApi:
          path: /auth/signup
          method: POST
      - httpApi:
          path: /auth/forgot-password
          method: POST
      - httpApi:
          path: /auth/reset-password
          method: POST
      - httpApi:
          path: /auth/confirm-code
          method: POST
      # GET requests with caching
      - httpApi:
          path: /{proxy+}
          method: GET
      # POST requests (no caching)
      - httpApi:
          path: /{proxy+}
          method: POST
      # PUT requests (no caching)
      - httpApi:
          path: /{proxy+}
          method: PUT
      # DELETE requests (no caching)
      - httpApi:
          path: /{proxy+}
          method: DELETE

  presignUpload:
    handler: src/handler.presignUpload
    memorySize: 256
    timeout: 10
    architecture: arm64
    events:
      - httpApi:
          path: /files/presign
          method: POST

  uploadFile:
    handler: src/handler.uploadFile
    memorySize: 512
    timeout: 25
    architecture: arm64
    events:
      - httpApi:
          path: /files/upload
          method: POST

  generateDownloadUrl:
    handler: src/handler.generateDownloadUrl
    memorySize: 256
    timeout: 10
    architecture: arm64
    events:
      - httpApi:
          path: /files/download-url
          method: POST

  notifyStatusChange:
    handler: src/handler.notifyStatusChange

  postConfirmation:
    handler: src/handler.postConfirmation
    memorySize: 256
    timeout: 10
    architecture: arm64
    events:
      - cognitoUserPool:
          pool: ${self:service}-${sls:stage}-userpool
          trigger: PostConfirmation
          existing: true

  customMessage:
    handler: src/handler.customMessage
    memorySize: 256
    timeout: 10
    architecture: arm64
    name: CustomMessageLambdaFunction
    events:
      - cognitoUserPool:
          pool: ${self:service}-${sls:stage}-userpool
          trigger: CustomMessage
          existing: true

resources:
  Conditions:
    HasApiDomain:
      Fn::Not:
        - Fn::Equals:
            - ""
            - ${param:apiDomainName, ""}
    HasFrontendDomain:
      Fn::Not:
        - Fn::Equals:
            - ""
            - ${param:frontendDomainName, ""}
    HasWaf:
      Fn::Not:
        - Fn::Equals:
            - ""
            - ${param:wafArn, ""}

  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        AttributeDefinitions:
          - { AttributeName: id, AttributeType: S }
          - { AttributeName: email, AttributeType: S }
        KeySchema:
          - { AttributeName: id, KeyType: HASH }
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema: [{ AttributeName: email, KeyType: HASH }]
            Projection: { ProjectionType: ALL }
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    FormsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.FORMS_TABLE}
        AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
        KeySchema: [{ AttributeName: id, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    ApplicationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.APPLICATIONS_TABLE}
        AttributeDefinitions:
          - { AttributeName: id, AttributeType: S }
          - { AttributeName: userId, AttributeType: S }
          - { AttributeName: status, AttributeType: S }
        KeySchema: [{ AttributeName: id, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        GlobalSecondaryIndexes:
          - IndexName: userId-index
            KeySchema: [{ AttributeName: userId, KeyType: HASH }]
            Projection: { ProjectionType: ALL }
          - IndexName: status-index
            KeySchema: [{ AttributeName: status, KeyType: HASH }]
            Projection: { ProjectionType: ALL }
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    RolesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ROLES_TABLE}
        AttributeDefinitions: [{ AttributeName: roleName, AttributeType: S }]
        KeySchema: [{ AttributeName: roleName, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    AuditLogsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.AUDIT_TABLE}
        AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
        KeySchema: [{ AttributeName: id, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    RateLimitTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.RATE_LIMIT_TABLE}
        AttributeDefinitions: [{ AttributeName: key, AttributeType: S }]
        KeySchema: [{ AttributeName: key, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    SecurityEventsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SECURITY_EVENTS_TABLE}
        AttributeDefinitions:
          - { AttributeName: id, AttributeType: S }
          - { AttributeName: sourceIP, AttributeType: S }
          - { AttributeName: timestamp, AttributeType: S }
        KeySchema: [{ AttributeName: id, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        GlobalSecondaryIndexes:
          - IndexName: sourceIP-timestamp-index
            KeySchema:
              - { AttributeName: sourceIP, KeyType: HASH }
              - { AttributeName: timestamp, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    TokenBlacklistTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TOKEN_BLACKLIST_TABLE}
        AttributeDefinitions:
          - { AttributeName: jti, AttributeType: S }
          - { AttributeName: sub, AttributeType: S }
          - { AttributeName: exp, AttributeType: N }
        KeySchema: [{ AttributeName: jti, KeyType: HASH }]
        BillingMode: PAY_PER_REQUEST
        SSESpecification: { SSEEnabled: true }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        GlobalSecondaryIndexes:
          - IndexName: sub-exp-index
            KeySchema:
              - { AttributeName: sub, KeyType: HASH }
              - { AttributeName: exp, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: uniapply-app-${sls:stage}-webbucket
        OwnershipControls:
          Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
        VersioningConfiguration: { Status: Enabled }
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldVersions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: 30
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - ${param:appBaseUrl}
              AllowedMethods: [GET, HEAD]
              AllowedHeaders: ["*"]

    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: uniapply-app-${sls:stage}-uploads
        OwnershipControls:
          Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
        VersioningConfiguration: { Status: Enabled }
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - ${param:appBaseUrl}
                - ${param:localDevUrl}
              AllowedMethods: [GET, PUT]
              AllowedHeaders: ["*"]
              ExposedHeaders: ["ETag"]

    UploadsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: { Ref: UploadsBucket }
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: EnforceTLS
              Effect: Deny
              Principal: "*"
              Action: "s3:*"
              Resource:
                - { "Fn::GetAtt": [UploadsBucket, Arn] }
                - {
                    "Fn::Join":
                      ["", [{ "Fn::GetAtt": [UploadsBucket, Arn] }, "/*"]],
                  }
              Condition:
                Bool: { aws:SecureTransport: "false" }

    CloudFrontOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    SecurityHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${sls:stage}-security-headers
          SecurityHeadersConfig:
            ContentSecurityPolicy:
              ContentSecurityPolicy: >-
                default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none';
              Override: true
            StrictTransportSecurity:
              AccessControlMaxAgeSec: 63072000
              IncludeSubdomains: true
              Preload: true
              Override: true
            ContentTypeOptions: { Override: true }
            FrameOptions: { FrameOption: DENY, Override: true }
            ReferrerPolicy: { ReferrerPolicy: "no-referrer", Override: true }

    WebCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-${sls:stage}-web-cache-policy
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            CookiesConfig:
              CookieBehavior: none
            HeadersConfig:
              HeaderBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: all
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true

    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          HttpVersion: http2and3
          Origins:
            - Id: WebBucketOrigin
              DomainName: { "Fn::GetAtt": [WebBucket, RegionalDomainName] }
              S3OriginConfig: {}
              OriginAccessControlId: { Ref: CloudFrontOAC }
          DefaultCacheBehavior:
            TargetOriginId: WebBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: { Ref: WebCachePolicy }
            ResponseHeadersPolicyId: { Ref: SecurityHeadersPolicy }
          PriceClass: PriceClass_100
          Aliases:
            Fn::If:
              - HasFrontendDomain
              - - ${param:frontendDomainName}
              - Ref: AWS::NoValue
          ViewerCertificate:
            Fn::If:
              - HasFrontendDomain
              - AcmCertificateArn: ${param:frontendCertificateArn}
                SslSupportMethod: sni-only
                MinimumProtocolVersion: TLSv1.2_2021
              - CloudFrontDefaultCertificate: true
          CustomErrorResponses:
            - {
                ErrorCode: 403,
                ResponsePagePath: /index.html,
                ResponseCode: 200,
                ErrorCachingMinTTL: 0,
              }
            - {
                ErrorCode: 404,
                ResponsePagePath: /index.html,
                ResponseCode: 200,
                ErrorCachingMinTTL: 0,
              }

    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: { Ref: WebBucket }
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource:
                { "Fn::Join": ["", [{ "Fn::GetAtt": [WebBucket, Arn] }, "/*"]] }
              Condition:
                StringEquals:
                  AWS:SourceArn:
                    {
                      "Fn::Join":
                        [
                          "",
                          [
                            "arn:aws:cloudfront::",
                            { Ref: "AWS::AccountId" },
                            ":distribution/",
                            { Ref: WebDistribution },
                          ],
                        ],
                    }

    ApiDomainName:
      Type: AWS::ApiGatewayV2::DomainName
      Condition: HasApiDomain
      Properties:
        DomainName: ${param:apiDomainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:apiCertificateArn}
            EndpointType: REGIONAL
            SecurityPolicy: TLS_1_2

    ApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: { Ref: HttpApi }
        StageName: ${sls:stage}
        AutoDeploy: true

    ApiBasePathMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: HasApiDomain
      Properties:
        DomainName: ${param:apiDomainName}
        ApiId: { Ref: HttpApi }
        Stage: { Ref: ApiStage }

    ApiDnsRecord:
      Type: AWS::Route53::RecordSet
      Condition: HasApiDomain
      Properties:
        HostedZoneId: ${param:apiHostedZoneId}
        Name: ${param:apiDomainName}
        Type: A
        AliasTarget:
          DNSName: { "Fn::GetAtt": [ApiDomainName, RegionalDomainName] }
          HostedZoneId: { "Fn::GetAtt": [ApiDomainName, RegionalHostedZoneId] }

    FrontendDnsRecord:
      Type: AWS::Route53::RecordSet
      Condition: HasFrontendDomain
      Properties:
        HostedZoneId: ${param:frontendHostedZoneId}
        Name: ${param:frontendDomainName}
        Type: A
        AliasTarget:
          DNSName: { "Fn::GetAtt": [WebDistribution, DomainName] }
          HostedZoneId: Z2FDTNDATAQYW2

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${sls:stage}-userpool
        AutoVerifiedAttributes: [email]
        UsernameAttributes: [email]
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            RequireUppercase: true
            TemporaryPasswordValidityDays: 7
        MfaConfiguration: "OFF"
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: "verified_email"
              Priority: 1
        VerificationMessageTemplate:
          DefaultEmailOption: "CONFIRM_WITH_CODE"
        EmailConfiguration:
          EmailSendingAccount: "COGNITO_DEFAULT"
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${sls:stage}-client
        UserPoolId: { Ref: CognitoUserPool }
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders: [COGNITO]
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [email, openid, profile]
        CallbackURLs:
          - ${param:appBaseUrl}
          - ${param:localDevUrl}
        LogoutURLs:
          - ${param:appBaseUrl}
          - ${param:localDevUrl}
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30

    SesEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: ${env:SES_SENDER_EMAIL, 'no-reply@uniapply.app'}

  Outputs:
    WebBucketName:
      Value: { Ref: WebBucket }
    WebDistributionId:
      Value: { Ref: WebDistribution }
    WebDistributionDomain:
      Value: { "Fn::GetAtt": [WebDistribution, DomainName] }
    ApiCustomDomain:
      Condition: HasApiDomain
      Value: ${param:apiDomainName}
    FrontendCustomDomain:
      Condition: HasFrontendDomain
      Value: ${param:frontendDomainName}
